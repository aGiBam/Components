<div (click)="closeModal()" class="ui dimmer visible active">
  <div (click)="$event.stopPropagation()" class="ui modal visible active">
    <i (click)="closeModal($event)" class="close icon"></i>
    <div class="header">
      Modal Title
    </div>
    <div class="content">
      <p>
        Some contents of the modal
      </p>
    </div>
    <div class="actions">
      <div (click)="closeModal($event)" class="ui button">OK</div>
    </div>
  </div>
</div>
